[include]
files = []

[bar.main]
position = "top"
thickness = 34
background_opacity = 0.7
radius = 20
margin_ends = 4
margin_edge = 2
padding = 8
widget_spacing = 6
scale = 1.0
font_scale = 1.0
font_family = "JetBrainsMono Nerd Font"
shadow = true
auto_hide = false
reserve_space = true
capsule = true
# No active-window title or task list: the dock owns app switching.
start = ["os-logo", "workspaces"]
center = ["group:media-compact"]
end = ["tray", "network", "notifications", "battery", "volume", "brightness", "clock", "bar-profile", "control-center"]

[[bar.main.capsule_group]]
id = "media-compact"
members = ["notoxus/media-island:now-playing", "media-wave-compact"]
fill = "#000000"
foreground = "#FFFFFF"
opacity = 1.0
radius = 80
padding = 6
widget_spacing = 6

[widget.media-compact]
capsule = false

# Keep the Top profile's dock separate from the main bar.
[dock]
enabled = true
position = "bottom"
icon_size = 38
main_axis_padding = 12
cross_axis_padding = 7
item_spacing = 7
background_opacity = 0.92
border = "outline"
border_width = 1.0
radius = 18
concave_edge_corners = true
margin_ends = 420
margin_edge = 8
shadow = true
show_running = true
auto_hide = true
smart_auto_hide = false
reserve_space = false
layer = "overlay"
active_scale = 1.0
inactive_scale = 0.82
magnification = true
magnification_scale = 1.5
active_opacity = 1.0
inactive_opacity = 0.82
show_dots = true
show_instance_count = true
launcher_position = "end"
launcher_icon = "grid-dots"

[include]
files = ["../fragments/media-island.toml"]

[bar.main]
position = "bottom"
thickness = 42
background_opacity = 0.96
border = "#3B4261"
border_width = 1.0
radius = 22
concave_edge_corners = true
margin_ends = 12
margin_edge = 0
padding = 14
widget_spacing = 8
scale = 1.0
font_scale = 1.0
font_family = "JetBrainsMono Nerd Font"
font_weight = 600
shadow = true
auto_hide = false
reserve_space = true
capsule = false
start = ["os-logo", "workspaces", "taskbar"]
center = ["group:media-compact"]
end = ["network", "notifications", "volume", "battery", "clock", "bar-profile", "control-center", "session"]

[widget.taskbar]
pinned = ["nautilus"]

[[bar.main.capsule_group]]
id = "media-compact"
members = ["media-compact", "media-wave-compact"]
fill = "#000000"
foreground = "#FFFFFF"
opacity = 1.0
radius = 80
padding = 6
widget_spacing = 6

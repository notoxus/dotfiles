[include]
files = ["../fragments/media-island.toml"]

# Match the opacity of the regular side bar.
[bar.media-island]
background_opacity = 0.94

[bar.main]
position = "left"
thickness = 48
background_opacity = 0.94
radius = 20
margin_ends = 10
margin_edge = 8
padding = 8
widget_spacing = 8
scale = 1.0
font_scale = 1.0
font_family = "JetBrainsMono Nerd Font"
shadow = true
auto_hide = false
reserve_space = true
capsule = false
start = ["os-logo", "workspaces", "taskbar"]
center = ["clock"]
end = ["network", "notifications", "volume", "battery", "bar-profile", "control-center", "session"]

[dock]
enabled = true
position = "right"
icon_size = 38
main_axis_padding = 12
cross_axis_padding = 7
item_spacing = 7
background_opacity = 0.92
border = "outline"
border_width = 1.0
radius = 18
concave_edge_corners = false
margin_ends = 12
margin_edge = 8
shadow = true
show_running = true
auto_hide = false
smart_auto_hide = false
reserve_space = false
layer = "overlay"
active_scale = 1.0
inactive_scale = 0.82
magnification = true
magnification_scale = 1.5
active_opacity = 1.0
inactive_opacity = 0.82
show_dots = true
show_instance_count = true
launcher_position = "end"
launcher_icon = "grid-dots"
pinned = []

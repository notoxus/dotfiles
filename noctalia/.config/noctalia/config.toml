# Noctalia v5 configuration.

[include]
autoload = false
files = ["bar-profile.toml", "fragments/media-island-action.toml", "fragments/media-pill-runtime.toml"]

[shell]
corner_radius_scale = 1.0
telemetry_enabled = false
polkit_agent = true
clipboard_enabled = false

# Present animation preset
[shell.animation]
enabled = true
speed = 2.0

[shell.shadow]
direction = "down_right"
alpha = 0.55

[shell.panel]
transparency_mode = "soft"
borders = true
shadow = true
launcher_placement = "floating"
clipboard_placement = "floating"
control_center_placement = "attached"
open_near_click_control_center = false
wallpaper_placement = "floating"
session_placement = "floating"
launcher_position = "center"

[shell.launcher]
categories = false
show_icons = true
compact = false
app_grid = false
sort_by_usage = true
pinned = []

[wallpaper]
enabled = true
fill_mode = "crop"

transition = ["fade", "wipe", "disc", "stripes", "zoom", "honeycomb"]
transition_duration = 1500

transition_on_startup = false
directory = "~/Pictures/Wallpapers"

# Keep the normal wallpaper stationary inside Niri's overview backdrop.
[backdrop]
enabled = false

[theme]
mode = "dark"
source = "builtin"
builtin = "Tokyo-Night"

[notification]
enable_daemon = true
background_opacity = 0.97

[lockscreen]
enabled = true
blurred_desktop = false
blur_intensity = 0.35
tint_intensity = 0.4

[idle]
behavior_order = ["lock"]
pre_action_fade_seconds = 2.0

[idle.behavior.lock]
timeout = 600
action = "lock"
enabled = true

[system.monitor]
enabled = true

[weather]
enabled = true
unit = "celsius"

[location]
auto_locate = true

[audio]
enable_overdrive = false
enable_sounds = false

[brightness]
enable_ddcutil = false

[plugins]
enabled = ["notoxus/os-logo", "notoxus/bar-profiles", "notoxus/media-island", "notoxus/vietnamese-lunar-calendar", "ashur-d/wallpaper-widget"]

[[control_center.shortcuts]]
type = "wifi"

[[control_center.shortcuts]]
type = "bluetooth"

[[control_center.shortcuts]]
type = "nightlight"

[[control_center.shortcuts]]
type = "notification"

[[control_center.shortcuts]]
type = "ashur-d/wallpaper-widget:toggle"

[[control_center.shortcuts]]
type = "session"

[widget.notifications]
hide_when_no_unread = false

[widget.notifications.actions]
left = "panel-toggle control-center notifications"

[widget.network]
show_label = false

[widget.network.actions]
left = "panel-toggle control-center network"

[widget.volume]
show_label = false

[widget.volume.actions]
left = "panel-toggle control-center audio"

[widget.battery]
display_mode = "graphic"
show_label = true

[widget.battery.actions]
left = "panel-toggle control-center power"

[widget.control-center]
glyph = "chevron-up"

[widget.session]
glyph = "power"
color = "#FF000C"

[widget.media]
hide_when_no_media = true
capsule = true
capsule_fill = "#000000"
capsule_foreground = "#FFFFFF"
capsule_opacity = 1.0
capsule_padding = 6
capsule_radius = 80
min_length = 120
max_length = 150
art_size = 18
hide_artist = true
title_scroll = "on_hover"
show_progress = true

[widget.media-wave-compact]
type = "audio_visualizer"
capsule = false
width = 34
bands = 9
mirrored = true
centered = true
show_when_idle = false
color_1 = "primary"
color_2 = "secondary"

# Expanded media presentation used only by the temporary top-center island.
[widget.media-island]
type = "media"
hide_when_no_media = true
capsule = false
min_length = 190
max_length = 240
art_size = 28
hide_artist = false
title_scroll = "always"
show_progress = true

[widget.media-previous]
type = "custom_button"
glyph = "player-skip-back"
tooltip = "Previous track"

[widget.media-previous.actions]
left = "media previous"

[widget.media-toggle]
type = "notoxus/media-island:playback-toggle"

[widget.media-next]
type = "custom_button"
glyph = "player-skip-forward"
tooltip = "Next track"

[widget.media-next.actions]
left = "media next"

[widget.media-wave]
type = "audio_visualizer"
width = 48
bands = 12
mirrored = true
centered = true
show_when_idle = true
color_1 = "primary"
color_2 = "secondary"

# Visually balances the expanded row so its album art sits slightly left of
# center without changing spacing between media controls.
[widget.media-balance]
type = "spacer"
length = 24

[widget.taskbar]
pinned = []
group_by_workspace = false
show_all_outputs = false
only_active_workspace = false
icon_scale = 0.9
item_spacing = 4
show_window_title = false
show_active_indicator = true
active_indicator_color = "primary"
active_opacity = 1.0
inactive_opacity = 0.7 # 0.75

[widget.os-logo]
type = "notoxus/os-logo:bar"

[widget.bar-profile]
type = "notoxus/bar-profiles:switcher"

[widget.clock]
format = "{:%H:%M:%S}"
tooltip_format = "{:%A, %B %d, %Y}"

[widget.clock.actions]
left = "panel-toggle notoxus/vietnamese-lunar-calendar:calendar"

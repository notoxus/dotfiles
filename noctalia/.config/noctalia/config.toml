# Noctalia v5 configuration.

[include]
autoload = false
files = ["bar-profile.toml"]

[shell]
corner_radius_scale = 1.0
telemetry_enabled = false
polkit_agent = true
clipboard_enabled = false

# Present animation preset
[shell.animation]
enabled = true
speed = 2.0

[shell.shadow]
direction = "down_right"
alpha = 0.55

[shell.panel]
transparency_mode = "soft"
borders = true
shadow = true
launcher_placement = "floating"
clipboard_placement = "floating"
control_center_placement = "attached"
open_near_click_control_center = false
wallpaper_placement = "floating"
session_placement = "floating"
launcher_position = "center"

[shell.launcher]
categories = false
show_icons = true
compact = false
app_grid = false
sort_by_usage = true
pinned = []

[wallpaper]
enabled = true
fill_mode = "crop"

transition = ["fade", "wipe", "disc", "stripes", "zoom", "honeycomb"]
transition_duration = 1500

transition_on_startup = false
directory = "~/Pictures/Wallpapers"

# Keep the normal wallpaper stationary inside Niri's overview backdrop.
[backdrop]
enabled = false

[theme]
mode = "dark"
source = "builtin"
builtin = "Tokyo-Night"

[notification]
enable_daemon = true
background_opacity = 0.97

[lockscreen]
enabled = true
blurred_desktop = false
blur_intensity = 0.35
tint_intensity = 0.4

[idle]
behavior_order = ["lock"]
pre_action_fade_seconds = 2.0

[idle.behavior.lock]
timeout = 600
action = "lock"
enabled = true

[system.monitor]
enabled = true

[weather]
enabled = true
unit = "celsius"

[location]
auto_locate = true
custom_schedule = true
sunset = "20:00" # night starts
sunrise = "05:00" # day starts

[audio]
enable_overdrive = false
enable_sounds = false

[brightness]
enable_ddcutil = false

# Follows the fixed day/night schedule in [location].
[nightlight]
enabled = true
force = false
temperature_day = 6500
temperature_night = 4000

[plugins]
enabled = ["notoxus/os-logo", "notoxus/bar-profiles", "notoxus/media-island", "notoxus/vietnamese-lunar-calendar", "ashur-d/wallpaper-widget"]

[[control_center.shortcuts]]
type = "wifi"

[[control_center.shortcuts]]
type = "bluetooth"

[[control_center.shortcuts]]
type = "nightlight"

[[control_center.shortcuts]]
type = "notification"

[[control_center.shortcuts]]
type = "ashur-d/wallpaper-widget:toggle"

[[control_center.shortcuts]]
type = "session"

[widget.notifications]
hide_when_no_unread = false

[widget.notifications.actions]
left = "panel-toggle control-center notifications"

[widget.network]
show_label = false

[widget.network.actions]
left = "panel-toggle control-center network"

[widget.volume]
show_label = false

[widget.volume.actions]
left = "panel-toggle control-center audio"

[widget.battery]
display_mode = "graphic"
show_label = true

[widget.battery.actions]
left = "panel-toggle control-center power"

[widget.control-center]
glyph = "adjustments"

[widget.media-wave-compact]
type = "audio_visualizer"
capsule = false
width = 34
bands = 9
mirrored = true
centered = true
show_when_idle = false
color_1 = "primary"
color_2 = "secondary"

[widget.os-logo]
type = "notoxus/os-logo:bar"

[widget.bar-profile]
type = "notoxus/bar-profiles:switcher"

[widget.clock]
format = "{:%H:%M:%S}"
tooltip_format = "{:%A, %B %d, %Y}"

[widget.clock.actions]
left = "panel-toggle notoxus/vietnamese-lunar-calendar:calendar"

[hooks]
shutting_down = "logger -t noctalia-hooks 'shutdown action started'"
session_locked = "logger -t noctalia-hooks 'session locked'"
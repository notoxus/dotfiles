id = "notoxus/media-island"
name = "Media Island"
version = "1.0.0"
plugin_api = 26
author = "notoxus"
license = "MIT"
dependencies = ["busctl"]
tags = ["bar", "media", "mpris"]
icon = "music"
description = "Playback-aware marquee and controls for the temporary media island."

[[setting]]
key = "scroll_while_paused"
type = "bool"
label_key = "settings.scroll-while-paused.label"
description_key = "settings.scroll-while-paused.description"
default = false

[[setting]]
key = "open_media_panel_on_click"
type = "bool"
label_key = "settings.open-media-panel.label"
description_key = "settings.open-media-panel.description"
default = false

[[setting]]
key = "panel_at_default_position"
type = "bool"
label_key = "settings.panel-default-position.label"
description_key = "settings.panel-default-position.description"
default = false

[[service]]
id = "media-state"
entry = "service.luau"

[[widget]]
id = "playback-toggle"
entry = "bar.luau"

  [widget.actions]
  left = "media toggle"

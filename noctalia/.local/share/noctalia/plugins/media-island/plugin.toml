id = "notoxus/media-island"
name = "Media Island"
version = "1.0.0"
plugin_api = 24
author = "notoxus"
license = "MIT"
dependencies = ["busctl"]
tags = ["bar", "media", "panel", "service"]
icon = "music"
description = "Playback-aware media island with configurable bar surface or top-center floating panel."

[[setting]]
key = "display_mode"
type = "string"
label_key = "settings.display-mode.label"
description_key = "settings.display-mode.description"
default = "bar"

[[setting]]
key = "preview_seconds"
type = "int"
label_key = "settings.preview-seconds.label"
description_key = "settings.preview-seconds.description"
default = 2
min = 1
max = 10
step = 1

[[setting]]
key = "always_scroll_title"
type = "bool"
label_key = "settings.always-scroll-title.label"
description_key = "settings.always-scroll-title.description"
default = false

[[setting]]
key = "open_media_panel_on_click"
type = "bool"
label_key = "settings.open-media-panel.label"
description_key = "settings.open-media-panel.description"
default = false

[[setting]]
key = "panel_at_default_position"
type = "bool"
label_key = "settings.panel-default-position.label"
description_key = "settings.panel-default-position.description"
default = false

[[setting]]
key = "auto_hide"
type = "bool"
label_key = "settings.auto-hide.label"
description_key = "settings.auto-hide.description"
default = true

[[service]]
id = "media-state"
entry = "service.luau"

[[widget]]
id = "playback-toggle"
entry = "bar.luau"

  [widget.actions]
  left = "media toggle"

# Panel Declarated from Community
[[panel]]
id = "island"
entry = "panel.luau"
width = 620
height = 118
position = "top_center"
persistent = true
dismiss_on_outside_click = false
keyboard_focus = "none"